# Customer-support bot for the webchat demo.
#   helix org bots apply -f bot/bot.yaml --org <org>
# Headless instance with a browser; one sandbox per customer session (each
# conversation in the demo app opens its own session through /sessions/chat).
id: b-support-demo
name: support-demo
parent_id: chief-of-staff
content_file: prompt.md

code_agent_runtime: opencode
code_agent_credential_type: api_key
provider: ds4-flash-node06
model: glm-5.3-flash
reasoning_effort: none
preserve_context: false

instance_profile:
  sandbox_runtime: headless-ubuntu
  mcp_servers: [chrome-devtools]
  tools: []
  helix_skills: false
